main.status=select bs.display_sequence, bs.id ,bs.bill_status_id as billStatusId, bs.status_date as statusDate,COALESCE(c.code_data ->> :locale, c.code_data ->> 'en') AS statusDisplayName,c.abbr from bills.bill_status bs left join master.codes c on c.id =bs.bill_status_id where bs.is_active = true and bs.bill_id =:billId order by bs.display_sequence 
pending.status=select bs.display_sequence, bs.id ,bs.pending_status_id as billStatusId, bs.pending_status_date as statusDate,COALESCE(c.code_data ->> :locale, c.code_data ->> 'en') AS statusDisplayName,c.abbr from bills.pending_status  bs left join master.codes c on c.id =bs.pending_status_id where bs.is_active = true and bs.bill_id =:billId order by bs.display_sequence
passed.status=select ps.display_sequence,ps.id,ps.lok_sabha_number as lokSabhaNumberId ,ps.lok_sabha_session_number as lokSabhaSessionNumberId,ps.rajya_sabha_session_number as rajyaSabhaSessionNumberId,ps.passed_date as passedDate ,h.house_name as houseName ,h.abbr as houseAbbr, lsm.lok_sabha_number as lokSabhaNumber,lssm.session_number as lokSabhaSessionNumber,rssm.session_number as rajyaSabhaSessionNumber from bills.passed_status ps left join master.houses h on ps.house_id=h.id left join master.rajya_sabha_session_master rssm on rssm.id=ps.rajya_sabha_session_number left join master.lok_sabha_masters lsm on lsm.id=ps.lok_sabha_number left join master.lok_sabha_session_masters lssm on lssm.id=ps.lok_sabha_session_number where ps.is_active =true and ps.bill_id = :billId order by ps.display_sequence 
bills.dashboard=select b1_0.id, b1_0.bill_no as billNo, b1_0.short_title as shortTitle, b1_0.introduced_by as introducedBy, coalesce (c2.code_data ->>':locale',c2.code_data ->>'en') as billCategory, b1_0.ministry as ministry, CONCAT_WS(' ', CASE WHEN c.abbr = 'NAME_INITIAL_Other' THEN pd.initials_other_en ELSE c.code_data->>'en' END, NULLIF(TRIM(pd.first_name), ''), NULLIF(TRIM(pd.middle_name), ''), NULLIF(TRIM(pd.last_name), '') ) as englishDisplayName, CONCAT_WS(' ', CASE WHEN c.abbr = 'NAME_INITIAL_Other' THEN pd.initials_other_hi ELSE coalesce(c.code_data->>'hi',c.code_data->>'en') END, NULLIF(TRIM(pd.first_name_hindi), ''), NULLIF(TRIM(pd.middle_name_hi), ''), NULLIF(TRIM(pd.last_name_hindi), '') ) as hindiDisplayName, b1_0.date_of_introduction as dateOfIntroduction, coalesce (c1.code_data ->>':locale',c1.code_data ->>'en') as status from bills.bill b1_0 inner join master.codes c2 on c2.abbr=b1_0.bill_category_abbr left join bills.bill_status bs on bs.display_sequence =1 and bs.bill_id = b1_0.id and bs.is_active=true left join members.personal_details pd on pd.id=b1_0.member_id left join master.codes c on c.id=pd.initials_id left join master.codes c1 on c1.id=bs.bill_status_id where b1_0.is_draft=false order by b1_0.created_at desc;
bill.history=select bh.id,bh.form_type as formType, bh.action_type as actionType, CONCAT_WS(' ', NULLIF(TRIM(bu.first_name), ''), NULLIF(TRIM(bu.middle_name), ''), NULLIF(TRIM(bu.last_name), '') ) as userName,bh.action_time as actionTime from bills.bill_history bh inner join authentication.base_user bu on bh.user_id=bu.id where bh.bill_id=:billId order by bh.action_time desc

bills.filter.select=select b1_0.id, b1_0.bill_no as billNo, b1_0.short_title as shortTitle, b1_0.introduced_by as introducedBy, coalesce (c2.code_data ->>':locale',c2.code_data ->>'en') as billCategory, b1_0.ministry as ministry, CONCAT_WS(' ', CASE WHEN c.abbr = 'NAME_INITIAL_Other' THEN pd.initials_other_en ELSE c.code_data->>'en' END, NULLIF(TRIM(pd.first_name), ''), NULLIF(TRIM(pd.middle_name), ''), NULLIF(TRIM(pd.last_name), '') ) as englishDisplayName, CONCAT_WS(' ', CASE WHEN c.abbr = 'NAME_INITIAL_Other' THEN pd.initials_other_hi ELSE coalesce(c.code_data->>'hi',c.code_data->>'en') END, NULLIF(TRIM(pd.first_name_hindi), ''), NULLIF(TRIM(pd.middle_name_hi), ''), NULLIF(TRIM(pd.last_name_hindi), '') ) as hindiDisplayName, b1_0.date_of_introduction as dateOfIntroduction, coalesce (c1.code_data ->>':locale',c1.code_data ->>'en') as status from bills.bill b1_0 inner join master.codes c2 on c2.abbr=b1_0.bill_category_abbr left join bills.bill_status bs on bs.display_sequence =1 and bs.bill_id = b1_0.id and bs.is_active=true left join members.personal_details pd on pd.id=b1_0.member_id left join master.codes c on c.id=pd.initials_id left join master.codes c1 on c1.id=bs.bill_status_id 
bills.filter.where=  where b1_0.is_draft=false
bills.orderBy=order by b1_0.created_at desc;
passedStatusCTE= WITH PassStatusCTE AS( SELECT pas.bill_id, CASE WHEN SUM(CASE WHEN h.abbr = 'LS' THEN 1 ELSE 0 END) > 0 AND SUM(CASE WHEN h.abbr = 'RS' THEN 1 ELSE 0 END) = 0 THEN 'LS' WHEN SUM(CASE WHEN h.abbr = 'LS' THEN 1 ELSE 0 END) = 0 AND SUM(CASE WHEN h.abbr = 'RS' THEN 1 ELSE 0 END) > 0 THEN 'RS' WHEN SUM(CASE WHEN h.abbr = 'LS' THEN 1 ELSE 0 END) > 0 AND SUM(CASE WHEN h.abbr = 'RS' THEN 1 ELSE 0 END) > 0 THEN 'Both' END AS pass_status FROM bills.passed_status pas INNER JOIN master.houses h ON h.id = pas.house_id WHERE pas.is_active = true GROUP BY pas.bill_id) SELECT bill_id FROM PassStatusCTE where pass_status = :status
