main.status=select bs.id ,bs.bill_status_id as billStatusId, bs.status_date as statusDate,COALESCE(c.code_data ->> :locale, c.code_data ->> 'en') AS statusDiplayName,c.abbr from bills.bill_status bs left join master.codes c on c.id =bs.bill_status_id where bs.is_active = true and bs.bill_id =:billId 