main.status=select bs.id ,bs.bill_status_id as billStatusId, bs.status_date as statusDate,COALESCE(c.code_data ->> :locale, c.code_data ->> 'en') AS statusDisplayName,c.abbr from bills.bill_status bs left join master.codes c on c.id =bs.bill_status_id where bs.is_active = true and bs.bill_id =:billId
pending.status=select bs.id ,bs.pending_status_id as billStatusId, bs.pending_status_date as statusDate,COALESCE(c.code_data ->> :locale, c.code_data ->> 'en') AS statusDisplayName,c.abbr from bills.pending_status  bs left join master.codes c on c.id =bs.pending_status_id where bs.is_active = true and bs.bill_id =:billId
passed.status=select ps.id,ps.lok_sabha_number as lokSabhaNumberId ,ps.lok_sabha_session_number as lokSabhaSessionNumberId,ps.rajya_sabha_session_number as rajyaSabhaSessionNumberId,ps.passed_date as passedDate ,h.house_name as houseName ,h.abbr as houseAbbr, lsm.lok_sabha_number as lokSabhaNumber,lssm.session_number as lokSabhaSessionNumber,rssm.session_number as rajyaSabhaSessionNumber from bills.passed_status ps left join master.houses h on ps.house_id=h.id left join master.rajya_sabha_session_master rssm on rssm.id=ps.rajya_sabha_session_number left join master.lok_sabha_masters lsm on lsm.id=ps.lok_sabha_number left join master.lok_sabha_session_masters lssm on lssm.id=ps.lok_sabha_session_number where ps.is_active =true and ps.bill_id = :billId